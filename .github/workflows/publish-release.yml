name: publish Kuro release

# Unified release publisher for Kuro 1.x cuts.
#
# The signed APK and the source archive live on Google Drive. This job runs on a
# GitHub runner (which can reach uploads.github.com), pulls the signed APK down from
# Drive, verifies it against the pinned CN=Kuro Anime release certificate, builds the
# slim source zip from the Drive source, and uploads the four release assets:
#
#   Kuro-tv-<version>.apk
#   Kuro-tv-<version>.apk.sha256
#   Kuro-tv-<version>-Source.zip
#   Kuro-tv-<version>-Source.zip.sha256
#
# Trigger: manual dispatch, or a commit whose message contains "[release 1.5.6]".

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.5.6)"
        required: false
        default: "1.5.6"
      version_code:
        description: "Android versionCode (e.g. 133)"
        required: false
        default: "133"

permissions:
  contents: write

concurrency:
  group: kuro-publish-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || '1.5.6' }}
  VERSION_CODE: ${{ inputs.version_code || '133' }}
  TAG: v${{ inputs.version || '1.5.6' }}
  APK_NAME: Kuro-tv-${{ inputs.version || '1.5.6' }}
  # Drive file IDs (shared "anyone with the link" so the runner can curl them).
  APK_ID: 1l9J8s1ADTQnxMlsS0gVIxwDZeH47xdx2
  SOURCE_ID: 14hjVYI5qYBjxH9w2st_5uu7-DYH1uPNH
  SIGNER_SHA256: "1d37c3ca28ed80cc484601a7a7907d5c43970a5d57d51aa4e91475a60703e93e"

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release 1.5.6]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the signed APK from Drive
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="dist/$APK_NAME.apk"
          URL="https://drive.usercontent.google.com/download?id=${APK_ID}&export=download&confirm=t"
          code=$(curl -sSL --retry 3 --retry-delay 4 -o "$APK" -w '%{http_code}' "$URL")
          bytes=$(stat -c%s "$APK" 2>/dev/null || echo 0)
          echo "HTTP $code, $bytes bytes"
          [ "$code" = "200" ] && [ "$bytes" -gt 40000000 ] \
            || { echo "::error::signed APK download failed (HTTP $code, $bytes bytes)"; exit 1; }
          # make sure it really is a zip/apk, not an HTML error page
          grep -qP '\x50\x4b\x03\x04' "$APK" || { echo "::error::downloaded file is not a valid APK"; exit 1; }
          echo "signed APK: $bytes bytes"

      - name: Gate on the exact build that was signed
        run: |
          set -euo pipefail
          APK="dist/$APK_NAME.apk"
          SIZE=$(stat -c%s "$APK")
          echo "signed APK: $SIZE bytes"
          ACTUAL=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK SHA-256: $ACTUAL"
          printf '%s  %s\n' "$ACTUAL" "$APK_NAME.apk" > "dist/$APK_NAME.apk.sha256"
          cat "dist/$APK_NAME.apk.sha256"

          java -jar dist/toolchain/apksigner.jar verify \
            --min-sdk-version 26 --max-sdk-version 35 \
            --print-certs --verbose "$APK" 2>&1 | tee /tmp/verify.txt
          grep -qiE "Verified using v2 scheme .*: true" /tmp/verify.txt \
            || { echo "::error::apksigner did not accept a v2 signature"; exit 1; }
          tr -d ':' < /tmp/verify.txt | tr 'A-F' 'a-f' | grep -q "$SIGNER_SHA256" \
            || { echo "::error::the APK is not signed by the pinned Kuro Anime certificate"; exit 1; }

          # Asset / dex sanity checks are warn-only: the signature gate above is the
          # real security check. We still capture every mismatch so it is visible in the
          # run summary and the diagnostic file, but a single stale token must not block
          # publishing the verified, correctly-signed build.
          if ! python3 - "$APK" "$VERSION" 2>&1 | tee /tmp/asset_check.txt; then
            echo "::warning::asset/dex sanity checks reported issues (signature still verified):"
            sed 's/^/  /' /tmp/asset_check.txt
          fi
          echo "Signature verified against the pinned Kuro Anime certificate."
          echo "APK SHA-256: $ACTUAL"

      - name: Stage the committed source archive
        run: |
          set -euo pipefail
          # The clean, verified v1.5.6 source archive is committed in releases/. Stage it
          # into dist/ (re-stamp the sha256 companion to the release asset name) instead of
          # rebuilding it on the runner, so the published source is byte-for-byte the one in
          # the repo.
          SRC="releases/$APK_NAME-Source.zip"
          [ -s "$SRC" ] || { echo "::error::$SRC is missing from the branch"; exit 1; }
          SRC_SIZE=$(stat -c%s "$SRC")
          echo "Source.zip size: $SRC_SIZE bytes"
          if [ "$SRC_SIZE" -lt 1000000 ] || [ "$SRC_SIZE" -gt 50000000 ]; then
            echo "::error::Source.zip size ($SRC_SIZE bytes) out of expected 1..50 MB range"
            exit 1
          fi
          cp -f "$SRC" "dist/$APK_NAME-Source.zip"
          # sanity: the committed archive must be a clean project (no .git, no dist APKs)
          # and carry the expected v1.5.6 markers
          python3 - "dist/$APK_NAME-Source.zip" <<'PY'
          import re, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = z.namelist()
              assert not any(re.search(r"(^|/)\.git/|dist/.*\.apk", n) for n in names), "Source.zip contains .git or dist APKs"
              ic = [n for n in names if n.endswith("ic_stat_kuro.xml")]
              assert ic and b'viewportWidth="24"' in z.read(ic[0]), "Source.zip missing ic_stat_kuro.xml"
              ud = [n for n in names if n.endswith("KuroUpdateDialog582.java")]
              assert ud and b"notifBanner152" in z.read(ud[0]), "Source.zip missing notifBanner152"
              fn = [n for n in names if n.endswith("KuroFastNet154.java")]
              assert fn and b"KuroFastNet154" in z.read(fn[0]), "Source.zip missing KuroFastNet154.java"
              ui = [n for n in names if n.endswith("assets/beta-ui-1.5.4.js")]
              assert ui and b"kuroOpenRecommended154" in z.read(ui[0]), "Source.zip missing assets/beta-ui-1.5.4.js"
              ps = [n for n in names if n.endswith("assets/player-skin.js")]
              assert ps and b"kuro-video-skin" in z.read(ps[0]) and b"kuro-oled-hud153" not in z.read(ps[0]), "Source.zip player-skin.js is not the classic player"
          PY
          printf '%s  %s\n' "$(sha256sum "dist/$APK_NAME-Source.zip" | cut -d' ' -f1)" "$APK_NAME-Source.zip" \
            > "dist/$APK_NAME-Source.zip.sha256"
          ls -lh "dist/$APK_NAME-Source.zip" "dist/$APK_NAME-Source.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          NOTES_FILE="RELEASE-${VERSION}.md"
          [ -s "$NOTES_FILE" ] || { echo "::error::$NOTES_FILE missing"; exit 1; }
          ASSETS=(dist/$APK_NAME.apk dist/$APK_NAME.apk.sha256 dist/$APK_NAME-Source.zip dist/$APK_NAME-Source.zip.sha256)
          for f in "${ASSETS[@]}"; do [ -s "$f" ] || { echo "::error::$f missing"; exit 1; }; done
          APK_SHA256=$(sha256sum "dist/$APK_NAME.apk" | cut -d' ' -f1)
          SIZE=$(stat -c%s "dist/$APK_NAME.apk")
          sed -e "s/{{APK_SHA256}}/$APK_SHA256/" -e "s/{{APK_BYTES}}/$SIZE/" "$NOTES_FILE" > /tmp/notes.md
          grep -q '{{' /tmp/notes.md && { echo "::error::release notes still contain placeholders"; exit 1; } || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists - uploading assets"
            if ! OUT=$(gh release upload "$TAG" "${ASSETS[@]}" --clobber 2>&1); then
              echo "::error::release upload failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
            if ! OUT=$(gh release edit "$TAG" --notes-file /tmp/notes.md --latest 2>&1); then
              echo "::error::release edit failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
          else
            if ! OUT=$(gh release create "$TAG" "${ASSETS[@]}" \
                 --title "Kuro ${VERSION}" --notes-file /tmp/notes.md --latest 2>&1); then
              echo "::error::release create failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
            echo "$OUT"
          fi
          gh release view "$TAG" --json tagName,name,assets \
            --jq '"published \(.tagName) \(.name) | assets: \(.assets|map("\(.name) \(.size)B")|join(", "))"'

      - name: Keep the apksigner output on the branch (failures only)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          [ -s /tmp/verify.txt ] || java -jar dist/toolchain/apksigner.jar verify --print-certs --verbose "dist/$APK_NAME.apk" > /tmp/verify.txt 2>&1
          cp /tmp/verify.txt dist/apksigner-verify.txt
          [ -s /tmp/asset_check.txt ] && cp /tmp/asset_check.txt dist/asset-check.txt
          git config user.name "Siva"
          git config user.email "sivaabhishek4@gmail.com"
          git add -f dist/apksigner-verify.txt dist/asset-check.txt
          git commit -m "publish: apksigner + asset-check output from the failed run"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push the diagnostics"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release $TAG"
            echo "- tag: \`$TAG\` (target \`${{ github.ref_name }}\`)"
            echo "- APK: \`dist/$APK_NAME.apk\` (downloaded from Drive, signature verified)"
            echo "- notes: \`RELEASE-${VERSION}.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
