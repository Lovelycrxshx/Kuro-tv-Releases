name: publish Kuro release

# Unified release publisher for Kuro 1.x cuts.
# The signed APK travels back into the branch as dist/Kuro-tv-<version>.apk (signed off
# this runner with the pinned CN=Kuro Anime release key), and this job only publishes
# when the SHA-256 matches the exact build that was signed.
#
# Trigger: manual dispatch, or a commit whose message contains "[release 1.5.2]".

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.5.2)"
        required: false
        default: "1.5.2"
      version_code:
        description: "Android versionCode (e.g. 94)"
        required: false
        default: "94"

permissions:
  contents: write

concurrency:
  group: kuro-publish-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || '1.5.2' }}
  VERSION_CODE: ${{ inputs.version_code || '94' }}
  TAG: v${{ inputs.version || '1.5.2' }}
  APK_NAME: Kuro-tv-${{ inputs.version || '1.5.2' }}
  APK_SHA256: "PENDING_AFTER_BUILD"
  SIGNER_SHA256: "1d37c3ca28ed80cc484601a7a7907d5c43970a5d57d51aa4e91475a60703e93e"
  UNSIGNED_SHA256: "PENDING_AFTER_BUILD"
  SOURCE_ID: 1tvE3FJdC_PIxGBN_fLlmqJMmRzjy65sO

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release 1.5.2]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Refuse to publish with an unset digest
        run: |
          set -euo pipefail
          for v in APK_SHA256 SIGNER_SHA256 UNSIGNED_SHA256; do
            if ! printf '%s' "${!v}" | grep -qE '^[0-9a-f]{64}$'; then
              echo "::error::$v is not a real digest ('${!v}')."
              exit 1
            fi
          done

      - name: Gate on the exact build that was signed
        run: |
          set -euo pipefail
          APK="dist/$APK_NAME.apk"
          [ -f "$APK" ] || { echo "::error::$APK is missing from this branch."; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "signed APK: $SIZE bytes"
          [ "$SIZE" -gt 40000000 ] || { echo "::error::$APK is only $SIZE bytes - that is not the build."; exit 1; }
          ACTUAL=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "expected: $APK_SHA256"
          echo "actual  : $ACTUAL"
          [ "$ACTUAL" = "$APK_SHA256" ] || { echo "::error::checksum mismatch - refusing to publish a different binary"; exit 1; }
          grep -q "$ACTUAL" "dist/$APK_NAME.apk.sha256" || { echo "::error::the .sha256 file does not match the APK"; exit 1; }
          UNSIGNED=$(sha256sum "dist/$APK_NAME-aligned.apk" | cut -d' ' -f1)
          echo "unsigned build: $UNSIGNED"
          [ "$UNSIGNED" = "$UNSIGNED_SHA256" ] || { echo "::error::the unsigned build in dist is not the one that was signed"; exit 1; }

          java -jar dist/toolchain/apksigner.jar verify \
            --min-sdk-version 26 --max-sdk-version 35 \
            --print-certs --verbose "$APK" 2>&1 | tee /tmp/verify.txt
          grep -qiE "Verified using v2 scheme .*: true" /tmp/verify.txt \
            || { echo "::error::apksigner did not accept a v2 signature"; exit 1; }
          tr -d ':' < /tmp/verify.txt | tr 'A-F' 'a-f' | grep -q "$SIGNER_SHA256" \
            || { echo "::error::the APK is not signed by the pinned Kuro Anime certificate"; exit 1; }

          for f in beta-motion-1.5.css beta-motion-1.5.js theme-rich-1.5.css \
                   beta-extras-1.5.css beta-extras-1.5.js beta-continue-1.5.js \
                   beta-whatsnew-1.5.js beta-downloads-1.5.js \
                   beta-polish-1.5.2.css beta-polish-1.5.2.js intro/animation.mp4; do
            unzip -l "$APK" | grep -q "assets/$f" \
              || { echo "::error::assets/$f is missing from the APK"; exit 1; }
            unzip -p "$APK" classes.dex | grep -aq "/$f" \
              || { echo "::error::$f is packed but the WebView would drop it"; exit 1; }
          done
          unzip -l "$APK" | grep -q "res/drawable/ic_stat_kuro.xml" \
            || { echo "::error::res/drawable/ic_stat_kuro.xml missing from APK"; exit 1; }
          unzip -p "$APK" assets/beta-whatsnew-1.5.js | grep -aFq "var STAMP = '${VERSION}';" \
            || { echo "::error::beta-whatsnew-1.5.js stamp is not ${VERSION}"; exit 1; }
          unzip -p "$APK" classes.dex | grep -aFq 'themeAmoled152' \
            || { echo "::error::classes.dex is missing themeAmoled152"; exit 1; }
          unzip -p "$APK" classes.dex | grep -aFq 'checkpointsExport152' \
            || { echo "::error::classes.dex is missing checkpointsExport152"; exit 1; }
          unzip -p "$APK" classes.dex | grep -aFq 'Update alerts are off' \
            || { echo "::error::classes.dex is missing the update notification banner"; exit 1; }
          echo "All ${VERSION} artifacts sane; APK matches the signed build."

      - name: Build slim source archive (clean Gradle project tree only)
        run: |
          set -euo pipefail
          URL="https://drive.usercontent.google.com/download?id=${SOURCE_ID}&export=download&confirm=t"
          code=$(curl -sSL --retry 3 --retry-delay 4 -o "$RUNNER_TEMP/src.zip" -w '%{http_code}' "$URL")
          bytes=$(stat -c%s "$RUNNER_TEMP/src.zip" 2>/dev/null || echo 0)
          echo "HTTP $code, $bytes bytes"
          [ "$code" = "200" ] && [ "$bytes" -gt 1000000 ] \
            || { echo "::error::source download failed (HTTP $code, $bytes bytes)"; exit 1; }
          WORK="$RUNNER_TEMP/kuro-src"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$RUNNER_TEMP/src.zip" -d "$WORK"
          PROJECT=$(dirname "$(find "$WORK" -maxdepth 3 -name settings.gradle -print -quit)")
          [ -n "$PROJECT" ] || { echo "::error::no settings.gradle in the source zip"; exit 1; }
          ( cd assets-1.1 && find . -type f -print0 ) | while IFS= read -r -d '' f; do
            mkdir -p "$PROJECT/assets/$(dirname "$f")"
            cp -f "assets-1.1/$f" "$PROJECT/assets/$f"
          done
          ( cd assets-beta && find . -type f -print0 ) | while IFS= read -r -d '' f; do
            mkdir -p "$PROJECT/assets/$(dirname "$f")"
            cp -f "assets-beta/$f" "$PROJECT/assets/$f"
          done
          python3 tools/webview_assets_1.3.py "$PROJECT" assets-1.1 assets-beta
          python3 tools/theme_native_1.2.py "$PROJECT"
          python3 tools/discord_link_1.5.py "$PROJECT"
          python3 tools/discord_rpc_download_1.5.py "$PROJECT"
          python3 tools/update_button_1.5.py "$PROJECT"
          python3 tools/offline_beta_1.5.py "$PROJECT"
          python3 tools/polish_1.5.2.py "$PROJECT"
          cp -f design/native-src/tests/native-panel/src/test/java/app/lovelycrxshx/kuro/KuroUpdater572Test.java \
            "$PROJECT/tests/native-panel/src/test/java/app/lovelycrxshx/kuro/KuroUpdater572Test.java"
          sed -i -E "s/versionCode +[0-9]+/versionCode ${VERSION_CODE}/" "$PROJECT/build.gradle"
          sed -i -E "s/versionName +'[^']*'/versionName '${VERSION}'/" "$PROJECT/build.gradle"
          grep -nE "versionName|versionCode" "$PROJECT/build.gradle"

          rm -f "$GITHUB_WORKSPACE/dist/$APK_NAME-Source.zip"
          ( cd "$PROJECT" && zip -qr "$GITHUB_WORKSPACE/dist/$APK_NAME-Source.zip" . )

          SRC_SIZE=$(stat -c%s "$GITHUB_WORKSPACE/dist/$APK_NAME-Source.zip")
          echo "Source.zip size: $SRC_SIZE bytes"
          if [ "$SRC_SIZE" -lt 1000000 ] || [ "$SRC_SIZE" -gt 40000000 ]; then
            echo "::error::Source.zip size ($SRC_SIZE bytes) out of expected 1..40 MB range (check PROJECT root)"
            exit 1
          fi
          ! unzip -l "dist/$APK_NAME-Source.zip" | grep -qE '(^|/)\.git/|dist/.*\.apk' \
            || { echo "::error::Source.zip accidentally contains .git or dist APKs"; exit 1; }
          unzip -p "dist/$APK_NAME-Source.zip" '*ic_stat_kuro.xml' | grep -Fq 'viewportWidth="24"' \
            || { echo "::error::the source archive is missing ic_stat_kuro.xml"; exit 1; }
          unzip -p "dist/$APK_NAME-Source.zip" '*KuroUpdateDialog582.java' | grep -Fq 'notifBanner152' \
            || { echo "::error::the source archive is missing notifBanner152"; exit 1; }
          printf '%s  %s\n' "$(sha256sum "dist/$APK_NAME-Source.zip" | cut -d' ' -f1)" "$APK_NAME-Source.zip" \
            > "dist/$APK_NAME-Source.zip.sha256"
          ls -lh "dist/$APK_NAME-Source.zip" "dist/$APK_NAME-Source.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          NOTES_FILE="RELEASE-${VERSION}.md"
          [ -s "$NOTES_FILE" ] || { echo "::error::$NOTES_FILE missing"; exit 1; }
          ASSETS=(dist/$APK_NAME.apk dist/$APK_NAME.apk.sha256 dist/$APK_NAME-Source.zip dist/$APK_NAME-Source.zip.sha256)
          for f in "${ASSETS[@]}"; do [ -s "$f" ] || { echo "::error::$f missing"; exit 1; }; done
          SIZE=$(stat -c%s "dist/$APK_NAME.apk")
          sed -e "s/{{APK_SHA256}}/$APK_SHA256/" -e "s/{{APK_BYTES}}/$SIZE/" "$NOTES_FILE" > /tmp/notes.md
          grep -q '{{' /tmp/notes.md && { echo "::error::release notes still contain placeholders"; exit 1; } || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists - uploading assets"
            if ! OUT=$(gh release upload "$TAG" "${ASSETS[@]}" --clobber 2>&1); then
              echo "::error::release upload failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
            if ! OUT=$(gh release edit "$TAG" --notes-file /tmp/notes.md --latest 2>&1); then
              echo "::error::release edit failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
          else
            if ! OUT=$(gh release create "$TAG" "${ASSETS[@]}" \
                 --title "Kuro ${VERSION}" --notes-file /tmp/notes.md --latest 2>&1); then
              echo "::error::release create failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
            echo "$OUT"
          fi
          gh release view "$TAG" --json tagName,name,assets \
            --jq '"published \(.tagName) \(.name) | assets: \(.assets|map("\(.name) \(.size)B")|join(", "))"'

      - name: Keep the apksigner output on the branch (failures only)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          [ -s /tmp/verify.txt ] || java -jar dist/toolchain/apksigner.jar verify --print-certs --verbose "dist/$APK_NAME.apk" > /tmp/verify.txt 2>&1
          cp /tmp/verify.txt dist/apksigner-verify.txt
          git config user.name "Siva"
          git config user.email "sivaabhishek4@gmail.com"
          git add -f dist/apksigner-verify.txt
          git commit -m "publish: apksigner output from the failed run"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push the diagnostics"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release $TAG"
            echo "- tag: \`$TAG\` (target \`${{ github.ref_name }}\`)"
            echo "- APK SHA-256 gate: \`$APK_SHA256\`"
            echo "- notes: \`RELEASE-${VERSION}.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
