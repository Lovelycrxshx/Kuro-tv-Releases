name: Build Kuro iOS IPA

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive File ID of Kuro-1.5.5-iOS-Source.zip"
        required: false
        default: "1nLZVZUQTOA8NPkXieZNe-yGIN72YfSoS"

permissions:
  contents: write

concurrency:
  group: kuro-ios-ipa
  cancel-in-progress: false

jobs:
  build-ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kuro-ios]')
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Kuro iOS Source Archive
        env:
          FILE_ID: ${{ inputs.drive_file_id || '1k2CvqQSYTfEJ9G2iG-v3QQOyIXIWEaF2' }}
        run: |
          mkdir -p /tmp/ios_work
          curl -fsSL "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o /tmp/ios_work/source.zip
          unzip -q /tmp/ios_work/source.zip -d /tmp/ios_work
          ls -la /tmp/ios_work/Kuro-1.5.5-iOS-Source

      - name: Ensure XcodeGen is installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode Project & Compile Release arm64 iOS App
        run: |
          set -eo pipefail
          cd /tmp/ios_work/Kuro-1.5.5-iOS-Source
          xcodegen generate

          xcodebuild \
            -project KuroIOS.xcodeproj \
            -scheme Kuro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/ios_work/derived \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            PRODUCT_BUNDLE_IDENTIFIER=app.kurotv.ios \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/ios_work/xcodebuild.log

      - name: Ad-Hoc Sign & Package Kuro-1.5.5-iOS.ipa
        run: |
          set -euo pipefail
          APP_PATH="/tmp/ios_work/derived/Build/Products/Release-iphoneos/Kuro.app"
          test -d "$APP_PATH"

          rm -rf /tmp/ios_work/ipa_stage
          mkdir -p /tmp/ios_work/ipa_stage/Payload
          cp -R "$APP_PATH" /tmp/ios_work/ipa_stage/Payload/Kuro.app

          codesign --force --sign - \
            --entitlements /tmp/ios_work/Kuro-1.5.5-iOS-Source/Kuro/Kuro.entitlements \
            --timestamp=none \
            /tmp/ios_work/ipa_stage/Payload/Kuro.app

          echo "=== Verified Info.plist & Mach-O Binary ===" | tee /tmp/ios_work/verify.log
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" /tmp/ios_work/ipa_stage/Payload/Kuro.app/Info.plist | tee -a /tmp/ios_work/verify.log
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /tmp/ios_work/ipa_stage/Payload/Kuro.app/Info.plist | tee -a /tmp/ios_work/verify.log
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" /tmp/ios_work/ipa_stage/Payload/Kuro.app/Info.plist | tee -a /tmp/ios_work/verify.log
          file /tmp/ios_work/ipa_stage/Payload/Kuro.app/Kuro | tee -a /tmp/ios_work/verify.log
          codesign -dvv /tmp/ios_work/ipa_stage/Payload/Kuro.app 2>&1 | tee -a /tmp/ios_work/verify.log

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp/ios_work/ipa_stage
          zip -qry "$GITHUB_WORKSPACE/dist/Kuro-1.5.5-iOS.ipa" Payload

          cd "$GITHUB_WORKSPACE/dist"
          shasum -a 256 Kuro-1.5.5-iOS.ipa > Kuro-1.5.5-iOS.ipa.sha256
          ls -lh Kuro-1.5.5-iOS.ipa Kuro-1.5.5-iOS.ipa.sha256

      - name: Commit Built IPA & Build Log to Branch
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [ -f /tmp/ios_work/xcodebuild.log ]; then
            grep -E "error:|warning:|SUCCEEDED|FAILED" /tmp/ios_work/xcodebuild.log | tail -n 120 > "$GITHUB_WORKSPACE/dist/kuro-ios-build.log" || true
            echo "--- TAIL ---" >> "$GITHUB_WORKSPACE/dist/kuro-ios-build.log"
            tail -n 80 /tmp/ios_work/xcodebuild.log >> "$GITHUB_WORKSPACE/dist/kuro-ios-build.log"
          fi
          if [ -f /tmp/ios_work/verify.log ]; then
            cat /tmp/ios_work/verify.log >> "$GITHUB_WORKSPACE/dist/kuro-ios-build.log"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add -f dist/kuro-ios-build.log
          if [ -f dist/Kuro-1.5.5-iOS.ipa ]; then
            git add -f dist/Kuro-1.5.5-iOS.ipa dist/Kuro-1.5.5-iOS.ipa.sha256
          fi
          if ! git diff --cached --quiet; then
            git commit -m "kuro-ios: runner log + ad-hoc signed IPA (app.kurotv.ios)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
