name: keep the README badge on the latest release

# shields.io caches its dynamic github/v/release badge: it was still drawing "v1.2"
# hours after 1.5 was published, so the number in the README is written here from
# GitHub's own answer to "what is the latest release".
#
# This job takes no version from a human. It asks the API for
# /releases/latest (which already excludes drafts and prereleases), so a manual run
# can only ever write the version that is actually the latest. That is deliberate:
# a free-text tag input is how the badge once ended up saying 1.6 when 1.5 was the
# latest release.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-badge
  cancel-in-progress: false

jobs:
  badge:
    # a prerelease is not "the latest version"; leave the badge alone for betas
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Rewrite the badge from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')
          echo "latest release: ${TAG:-<none>}"
          [ -n "$TAG" ] || { echo "::error::the API returned no latest release"; exit 1; }

          # If a release event fired for something that is not (or is no longer) the
          # latest, stop rather than write a stale number.
          if [ -n "${EVENT_TAG:-}" ] && [ "$EVENT_TAG" != "$TAG" ]; then
            echo "::notice::${EVENT_TAG} is not the latest release (${TAG}); leaving the badge alone"
            exit 0
          fi

          VER="${TAG#v}"
          printf '%s' "$VER" | grep -qE '^[0-9]+(\.[0-9]+)*$' \
            || { echo "::error::'$TAG' is not a plain version tag"; exit 1; }
          echo "badge version: $VER"

          OLD=$(grep -oE 'badge/Latest_Version-[^-)]*-blue' README.md | head -1 || true)
          echo "current badge: ${OLD:-none}"
          sed -i -E \
            -e "s#(badge/Latest_Version-)[^-)]*(-blue)#\1${VER}\2#" \
            -e "s#(\\[!\\[Download\\]\\(design/download-button\\.svg\\)\\]\\()[^)]*(\\))#\\1https://github.com/${REPO}/releases/download/v${VER}/Kuro-tv-${VER}.apk\\2#" \
            README.md
          NEW=$(grep -oE 'badge/Latest_Version-[^-)]*-blue' README.md | head -1 || true)
          echo "new badge: $NEW"
          [ -n "$NEW" ] || { echo "::error::the README has no release badge to rewrite"; exit 1; }

          if git diff --quiet -- README.md; then
            echo "already on $VER - nothing to commit"
            exit 0
          fi
          git config user.name "Siva"
          git config user.email "sivaabhishek4@gmail.com"
          git add README.md
          git commit -m "readme: latest release badge on $VER"
          git push origin HEAD:main
