name: publish Kuro 1.5.1 release

# This sandbox cannot reach uploads.github.com, but a runner can. The signed APK
# travels back into the branch as dist/Kuro-tv-1.5.1.apk (signed off this runner
# with the existing Kuro Anime release key), and this job only publishes when
# the SHA-256 matches the byte-exact build that was signed.
#
# Trigger: manual dispatch, or a commit whose message contains "[release 1.5.1]".

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuro-release
  cancel-in-progress: false

env:
  TAG: v1.5.1
  APK_NAME: Kuro-tv-1.5.1
  APK_SHA256: "645fba91c543f1fed4f8462f868cfc8ad7e6d62290b5b5dd935422c795053198"
  SIGNER_SHA256: "1d37c3ca28ed80cc484601a7a7907d5c43970a5d57d51aa4e91475a60703e93e"
  UNSIGNED_SHA256: "c25f43b491765981f340ad8af8ec669700c7f4d60fe771d9144bb89657333e87"
  SOURCE_ID: 1tvE3FJdC_PIxGBN_fLlmqJMmRzjy65sO

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release 1.5.1]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Refuse to publish with an unset digest
        run: |
          set -euo pipefail
          for v in APK_SHA256 SIGNER_SHA256 UNSIGNED_SHA256; do
            if ! printf '%s' "${!v}" | grep -qE '^[0-9a-f]{64}$'; then
              echo "::error::$v is not a real digest ('${!v}')."
              exit 1
            fi
          done

      - name: Gate on the exact build that was signed
        run: |
          set -euo pipefail
          APK="dist/$APK_NAME.apk"
          [ -f "$APK" ] || { echo "::error::$APK is missing from this branch."; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "signed APK: $SIZE bytes"
          [ "$SIZE" -gt 40000000 ] || { echo "::error::$APK is only $SIZE bytes - that is not the build."; exit 1; }
          ACTUAL=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "expected: $APK_SHA256"
          echo "actual  : $ACTUAL"
          [ "$ACTUAL" = "$APK_SHA256" ] || { echo "::error::checksum mismatch - refusing to publish a different binary"; exit 1; }
          grep -q "$ACTUAL" "dist/$APK_NAME.apk.sha256" || { echo "::error::the .sha256 file does not match the APK"; exit 1; }
          UNSIGNED=$(sha256sum "dist/$APK_NAME-aligned.apk" | cut -d' ' -f1)
          echo "unsigned build: $UNSIGNED"
          [ "$UNSIGNED" = "$UNSIGNED_SHA256" ] || { echo "::error::the unsigned build in dist is not the one that was signed"; exit 1; }

          # Independent signature check with the real apksigner.
          java -jar dist/toolchain/apksigner.jar verify \
            --min-sdk-version 26 --max-sdk-version 35 \
            --print-certs --verbose "$APK" 2>&1 | tee /tmp/verify.txt
          grep -qiE "Verified using v2 scheme .*: true" /tmp/verify.txt \
            || { echo "::error::apksigner did not accept a v2 signature"; exit 1; }
          tr -d ':' < /tmp/verify.txt | tr 'A-F' 'a-f' | grep -q "$SIGNER_SHA256" \
            || { echo "::error::the APK is not signed by the pinned Kuro Anime certificate"; exit 1; }

          # Verify 1.1..1.5.1 web + native layers inside the signed APK.
          unzip -p "$APK" 'assets/index.html' | grep -aq 'theme-teal-1.1.css' \
            || { echo "::error::the APK has no accent stylesheet linked - wrong build attached"; exit 1; }
          unzip -p "$APK" 'assets/index.html' | grep -aq 'theme-accent-1.1.js' \
            || { echo "::error::the APK has no accent picker - wrong build attached"; exit 1; }
          COUNT=$(unzip -l "$APK" | grep -cE 'assets/profile-art/(pfp|banner)/art-[0-9]{2}\.webp')
          echo "profile art files in the APK: $COUNT"
          [ "$COUNT" -ge 20 ] || { echo "::error::only $COUNT art files in the APK - the ten-pair pack did not ship"; exit 1; }
          unzip -p "$APK" classes.dex | grep -aq 'KuroWebAssets13' \
            || { echo "::error::the WebView has no overlay asset list - the theme would not load"; exit 1; }
          unzip -p "$APK" classes.dex | grep -aq 'KuroTheme12' \
            || { echo "::error::KuroTheme12 is missing from the APK - the native theme did not ship"; exit 1; }
          for f in beta-motion-1.5.css beta-motion-1.5.js theme-rich-1.5.css \
                   beta-extras-1.5.css beta-extras-1.5.js beta-continue-1.5.js \
                   beta-whatsnew-1.5.js beta-downloads-1.5.js intro/animation.mp4; do
            unzip -l "$APK" | grep -q "assets/$f" \
              || { echo "::error::assets/$f is missing from the APK"; exit 1; }
            unzip -p "$APK" classes.dex | grep -aq "/$f" \
              || { echo "::error::$f is packed but the WebView would drop it"; exit 1; }
          done
          test "$(unzip -l "$APK" | grep -cE 'assets/theme-[a-z]+-1\.1\.css')" -ge 20 \
            || { echo "::error::fewer than twenty accent stylesheets in the APK"; exit 1; }
          unzip -p "$APK" assets/beta-motion-1.5.js | grep -aFq 'INTRO_HOLD = 3600;' \
            || { echo "::error::beta-motion-1.5.js does not have the 3.6s INTRO_HOLD"; exit 1; }
          unzip -p "$APK" assets/beta-motion-1.5.css | grep -aFq 'km-iris .54s cubic-bezier(.62,.02,.9,.4) 3s forwards' \
            || { echo "::error::beta-motion-1.5.css does not have the 3s iris wipe"; exit 1; }
          unzip -p "$APK" assets/beta-whatsnew-1.5.js | grep -aFq "var STAMP = '1.5.1';" \
            || { echo "::error::beta-whatsnew-1.5.js stamp is not 1.5.1"; exit 1; }
          unzip -p "$APK" classes.dex | grep -aFq 'You are on the latest version' \
            || { echo "::error::classes.dex is missing 'You are on the latest version'"; exit 1; }
          unzip -p "$APK" classes.dex | grep -aFq 'UP TO DATE' \
            || { echo "::error::classes.dex is missing 'UP TO DATE'"; exit 1; }
          unzip -p "$APK" classes.dex | grep -aFq 'dismissEntry15' \
            || { echo "::error::classes.dex is missing dismissEntry15"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -p "$APK" "lib/$abi/libkuro_discord_rpc563.so" | grep -aq 'https://lovelycrxshx.github.io/Kuro-tv-Releases/' \
              || { echo "::error::lib/$abi/libkuro_discord_rpc563.so is missing the Download button URL"; exit 1; }
          done
          unzip -p "$APK" classes.dex | grep -aq 'option-download15' \
            || { echo "::error::classes.dex is missing option-download15"; exit 1; }
          unzip -p "$APK" assets/settings560.js | grep -aFq "['download','Download button'" \
            || { echo "::error::assets/settings560.js is missing the Download button toggle"; exit 1; }
          echo "All 1.5.1 artifacts sane; APK matches the signed build."

      - name: Build the 1.5.1 source archive (same overlays and rewrites as the build)
        run: |
          set -euo pipefail
          URL="https://drive.usercontent.google.com/download?id=${SOURCE_ID}&export=download&confirm=t"
          code=$(curl -sSL --retry 3 --retry-delay 4 -o "$RUNNER_TEMP/src.zip" -w '%{http_code}' "$URL")
          bytes=$(stat -c%s "$RUNNER_TEMP/src.zip" 2>/dev/null || echo 0)
          echo "HTTP $code, $bytes bytes"
          [ "$code" = "200" ] && [ "$bytes" -gt 1000000 ] \
            || { echo "::error::source download failed (HTTP $code, $bytes bytes)"; exit 1; }
          mkdir -p src
          unzip -q "$RUNNER_TEMP/src.zip" -d src
          PROJECT=$(dirname "$(find src -maxdepth 3 -name settings.gradle -print -quit)")
          [ -n "$PROJECT" ] || { echo "::error::no settings.gradle in the source zip"; exit 1; }
          ( cd assets-1.1 && find . -type f -print0 ) | while IFS= read -r -d '' f; do
            mkdir -p "$PROJECT/assets/$(dirname "$f")"
            cp -f "assets-1.1/$f" "$PROJECT/assets/$f"
          done
          ( cd assets-beta && find . -type f -print0 ) | while IFS= read -r -d '' f; do
            mkdir -p "$PROJECT/assets/$(dirname "$f")"
            cp -f "assets-beta/$f" "$PROJECT/assets/$f"
          done
          python3 tools/webview_assets_1.3.py "$PROJECT" assets-1.1 assets-beta
          python3 tools/theme_native_1.2.py "$PROJECT"
          python3 tools/discord_link_1.5.py "$PROJECT"
          python3 tools/discord_rpc_download_1.5.py "$PROJECT"
          python3 tools/update_button_1.5.py "$PROJECT"
          python3 tools/offline_beta_1.5.py "$PROJECT"
          cp -f design/native-src/tests/native-panel/src/test/java/app/lovelycrxshx/kuro/KuroUpdater572Test.java \
            "$PROJECT/tests/native-panel/src/test/java/app/lovelycrxshx/kuro/KuroUpdater572Test.java"
          sed -i -E "s/versionCode +[0-9]+/versionCode 93/" "$PROJECT/build.gradle"
          sed -i -E "s/versionName +'[^']*'/versionName '1.5.1'/" "$PROJECT/build.gradle"
          grep -nE "versionName|versionCode" "$PROJECT/build.gradle"
          ROOT=$(dirname "$PROJECT")
          rm -f "dist/$APK_NAME-Source.zip"
          ( cd "$ROOT" && zip -qr "$GITHUB_WORKSPACE/dist/$APK_NAME-Source.zip" . )
          unzip -p "dist/$APK_NAME-Source.zip" '*KuroUpdateDialog582.java' | grep -Fq 'You are on the latest version' \
            || { echo "::error::the source archive is missing the up-to-date message"; exit 1; }
          unzip -p "dist/$APK_NAME-Source.zip" '*beta-motion-1.5.js' | grep -Fq 'INTRO_HOLD = 3600;' \
            || { echo "::error::the source archive is missing the 3.6s INTRO_HOLD"; exit 1; }
          unzip -p "dist/$APK_NAME-Source.zip" '*kuro_discord_rpc563.cpp' | grep -q 'AddButton' \
            || { echo "::error::the source archive has no Discord Rich Presence Download button"; exit 1; }
          printf '%s  %s\n' "$(sha256sum "dist/$APK_NAME-Source.zip" | cut -d' ' -f1)" "$APK_NAME-Source.zip" \
            > "dist/$APK_NAME-Source.zip.sha256"
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ASSETS=(dist/$APK_NAME.apk dist/$APK_NAME.apk.sha256 dist/$APK_NAME-Source.zip dist/$APK_NAME-Source.zip.sha256)
          for f in "${ASSETS[@]}"; do [ -s "$f" ] || { echo "::error::$f missing"; exit 1; }; done
          SIZE=$(stat -c%s "dist/$APK_NAME.apk")
          sed -e "s/{{APK_SHA256}}/$APK_SHA256/" -e "s/{{APK_BYTES}}/$SIZE/" RELEASE-1.5.1.md > /tmp/notes.md
          grep -q '{{' /tmp/notes.md && { echo "::error::release notes still contain placeholders"; exit 1; } || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists - uploading assets"
            if ! OUT=$(gh release upload "$TAG" "${ASSETS[@]}" --clobber 2>&1); then
              echo "::error::release upload failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
            if ! OUT=$(gh release edit "$TAG" --notes-file /tmp/notes.md --latest 2>&1); then
              echo "::error::release edit failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
          else
            if ! OUT=$(gh release create "$TAG" "${ASSETS[@]}" \
                 --title "Kuro 1.5.1" --notes-file /tmp/notes.md --latest 2>&1); then
              echo "::error::release create failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
            echo "$OUT"
          fi
          gh release view "$TAG" --json tagName,name,assets \
            --jq '"published \(.tagName) \(.name) | assets: \(.assets|map("\(.name) \(.size)B")|join(", "))"'

      - name: Keep the apksigner output on the branch (failures only)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          [ -s /tmp/verify.txt ] || java -jar dist/toolchain/apksigner.jar verify --print-certs --verbose "dist/$APK_NAME.apk" > /tmp/verify.txt 2>&1
          cp /tmp/verify.txt dist/apksigner-verify.txt
          git config user.name "Siva"
          git config user.email "sivaabhishek4@gmail.com"
          git add -f dist/apksigner-verify.txt
          git commit -m "publish: apksigner output from the failed run"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push the diagnostics"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release $TAG"
            echo "- tag: \`$TAG\` (target \`${{ github.ref_name }}\`)"
            echo "- APK SHA-256 gate: \`$APK_SHA256\`"
            echo "- notes: \`RELEASE-1.5.1.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
