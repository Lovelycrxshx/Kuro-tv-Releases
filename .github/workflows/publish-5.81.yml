name: publish Kuro 5.81 release

# The sandbox that drives this repo cannot reach uploads.github.com, but a runner
# can. This job pulls the already-signed artifacts from Drive, proves the APK is
# byte-identical to the one that was built and signed (SHA-256 gate), and then
# publishes the v5.81 release with the binaries attached.
#
# Trigger: a commit whose message contains "[release]" (or a manual dispatch).
# The Drive files only need temporary "anyone with the link" access while this
# runs; they can be made private again afterwards.

on:
  push:
    branches: [arena/c7139fd4-kuro-tv-releases]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuro-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK_SHA256: 541f1b73ad1ad32ec92a3bba880cedbd67a3a829a4b0f4c28632812be10c960a
      TAG: v5.81
    steps:
      - uses: actions/checkout@v4

      - name: Pull the signed artifacts from Drive
        run: |
          set -euo pipefail
          mkdir -p dist
          dl() {
            local id="$1" name="$2"
            echo "downloading $name"
            curl -sSL --retry 4 --retry-delay 5 \
              -o "dist/$name" \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t"
            printf '  %s  %s bytes\n' "$name" "$(stat -c%s "dist/$name")"
          }
          dl 1rdI8LetQXVYZtEeo2K-26c328KmbSU3e Kuro-tv-5.81.apk
          dl 1vLeyQKRFcS22C3l-6U5L5Zdydm9_cAXk Kuro-tv-5.81.apk.sha256
          dl 1pQgzHzATuw6UDz_X5H0eP6AqMZUbpMuk Kuro-tv-5.81-Source.zip
          file dist/* | sed 's/^/  /'

      - name: Gate on the exact build that was signed
        run: |
          set -euo pipefail
          APK=dist/Kuro-tv-5.81.apk
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE"
          if [ "$SIZE" -lt 50000000 ]; then
            echo "::error::APK is only $SIZE bytes - that looks like a Drive interstitial page, not the build."
            head -c 300 "$APK"; exit 1
          fi
          ACTUAL=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "expected: $APK_SHA256"
          echo "actual  : $ACTUAL"
          if [ "$ACTUAL" != "$APK_SHA256" ]; then
            echo "::error::checksum mismatch - refusing to publish a different binary"
            exit 1
          fi
          # the attached checksum file must agree with the APK
          grep -q "$ACTUAL" dist/Kuro-tv-5.81.apk.sha256 || {
            echo "::error::the .sha256 file does not match the APK"; exit 1; }
          unzip -l dist/Kuro-tv-5.81-Source.zip | head -5 >/dev/null || {
            echo "::error::source zip is not a zip"; exit 1; }
          # this cut must actually contain the cast screen and the motion layer
          unzip -l "$APK" | grep -q 'assets/smooth-ui.js' || {
            echo "::error::the APK is missing assets/smooth-ui.js - wrong build attached"; exit 1; }
          unzip -p "$APK" 'classes*.dex' | grep -aq 'castStart561' || {
            echo "::error::the APK has no cast hand-back code - wrong build attached"; exit 1; }
          unzip -p "$APK" 'assets/accounts542.js' | grep -aq 'profile-stats571' || {
            echo "::error::the APK has no account activity strip - wrong build attached"; exit 1; }
          unzip -p "$APK" 'assets/accounts542.js' | grep -aq 'profile-continue571' || {
            echo "::error::the APK has no continue-watching row - wrong build attached"; exit 1; }
          unzip -p "$APK" 'assets/accounts542.js' | grep -aq 'profile-mono571' || {
            echo "::error::the APK has no profile monogram - wrong build attached"; exit 1; }
          if unzip -l "$APK" | grep -qE 'preset571-|profile-(avatar547|banner54|character549|default571)'; then
            echo "::error::the APK still ships profile artwork - wrong build attached"; exit 1; fi
          unzip -p "$APK" 'assets/app.js' | grep -aq 'hero-track581' || {
            echo "::error::the APK has no home hero deck - wrong build attached"; exit 1; }
          echo "All artifacts sane; APK matches the signed build."

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ASSETS=(dist/Kuro-tv-5.81.apk dist/Kuro-tv-5.81.apk.sha256 dist/Kuro-tv-5.81-Source.zip)
          echo "--- token/repo visibility ---"
          gh auth status 2>&1 | head -5
          gh api "repos/${GITHUB_REPOSITORY}" --jq '"repo=\(.full_name) private=\(.private) permissions=\(.permissions)"' 2>&1 | head -3
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists - uploading assets"
            if ! OUT=$(gh release upload "$TAG" "${ASSETS[@]}" --clobber 2>&1); then
              echo "::error::release upload failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
            if ! OUT=$(gh release edit "$TAG" --notes-file RELEASE-5.81.md --latest 2>&1); then
              echo "::error::release edit failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
          else
            if ! OUT=$(gh release create "$TAG" "${ASSETS[@]}" \
                 --title "Kuro 5.81" --notes-file RELEASE-5.81.md --latest 2>&1); then
              echo "::error::release create failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
            echo "$OUT"
          fi
          gh release view "$TAG" --json tagName,name,assets \
            --jq '"published \(.tagName) \(.name) | assets: \(.assets|map("\(.name) \(.size)B")|join(", "))"'

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release $TAG"
            echo "- tag: \`$TAG\` (target \`${{ github.ref_name }}\`)"
            echo "- APK SHA-256 gate: \`$APK_SHA256\`"
            echo "- notes: \`RELEASE-5.81.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
