name: publish Kuro 1.5 release

# This sandbox cannot reach uploads.github.com, but a runner can. The signed APK
# travels back into the branch as dist/Kuro-tv-1.4.apk (the owner signs it off
# this runner with the existing release key), and this job only publishes when
# the SHA-256 matches the byte-exact build that was signed.
#
# The 1.2 source archive is produced here too: the 1.0 tree from Drive plus the
# same assets-1.1 overlay and the same tools/theme_native_1.2.py rewrite the
# build applied, so the published source and the published binary are the same
# program.
#
# Trigger: manual dispatch, or a commit whose message contains "[release]".

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuro-release
  cancel-in-progress: false

env:
  TAG: v1.5
  APK_NAME: Kuro-tv-1.5
  # SHA-256 of the signed APK committed as dist/Kuro-tv-1.5.apk. Signed with the
  # Kuro Anime release key; the job re-checks the signature with the real
  # apksigner before it publishes.
  APK_SHA256: "c06b31bd4ef9fbfe3ee250b70a1e738a7ac7f4da0dc78225512de9b923e7eeba"
  SIGNER_SHA256: "1d37c3ca28ed80cc484601a7a7907d5c43970a5d57d51aa4e91475a60703e93e"
  UNSIGNED_SHA256: "f027a018ed278df68e86b0f61eec94ba5ae687c4313675ab6c7f445b847aad3f"
  # The 1.0 source zip the 1.1 assets and the 1.2 native theme are applied to.
  SOURCE_ID: 1tvE3FJdC_PIxGBN_fLlmqJMmRzjy65sO

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Refuse to publish with an unset digest
        run: |
          set -euo pipefail
          for v in APK_SHA256 SIGNER_SHA256 UNSIGNED_SHA256; do
            if ! printf '%s' "${!v}" | grep -qE '^[0-9a-f]{64}$'; then
              echo "::error::$v is not a real digest ('${!v}')."
              exit 1
            fi
          done

      - name: Gate on the exact build that was signed
        run: |
          set -euo pipefail
          APK="dist/$APK_NAME.apk"
          [ -f "$APK" ] || { echo "::error::$APK is missing from this branch."; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "signed APK: $SIZE bytes"
          [ "$SIZE" -gt 40000000 ] || { echo "::error::$APK is only $SIZE bytes - that is not the build."; exit 1; }
          ACTUAL=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "expected: $APK_SHA256"
          echo "actual  : $ACTUAL"
          [ "$ACTUAL" = "$APK_SHA256" ] || { echo "::error::checksum mismatch - refusing to publish a different binary"; exit 1; }
          grep -q "$ACTUAL" "dist/$APK_NAME.apk.sha256" || { echo "::error::the .sha256 file does not match the APK"; exit 1; }
          # the signed file must be our build plus a signature block, nothing else
          UNSIGNED=$(sha256sum "dist/$APK_NAME-aligned.apk" | cut -d' ' -f1)
          echo "unsigned build: $UNSIGNED"
          [ "$UNSIGNED" = "$UNSIGNED_SHA256" ] || { echo "::error::the unsigned build in dist is not the one that was signed"; exit 1; }

          # Independent signature check with the real apksigner (no JDK elsewhere).
          # The APK declares minSdkVersion 26, and v2 is the only scheme this signer
          # emits, so tell apksigner the range instead of letting it fall back to v1.
          java -jar dist/toolchain/apksigner.jar verify \
            --min-sdk-version 26 --max-sdk-version 35 \
            --print-certs --verbose "$APK" 2>&1 | tee /tmp/verify.txt
          grep -qiE "Verified using v2 scheme .*: true" /tmp/verify.txt \
            || { echo "::error::apksigner did not accept a v2 signature"; exit 1; }
          tr -d ':' < /tmp/verify.txt | tr 'A-F' 'a-f' | grep -q "$SIGNER_SHA256" \
            || { echo "::error::the APK is not signed by the pinned Kuro Anime certificate"; exit 1; }

          # The 1.1 web layer must still be inside the binary.
          unzip -p "$APK" 'assets/index.html' | grep -aq 'theme-teal-1.1.css' \
            || { echo "::error::the APK has no accent stylesheet linked - wrong build attached"; exit 1; }
          unzip -p "$APK" 'assets/index.html' | grep -aq 'theme-accent-1.1.js' \
            || { echo "::error::the APK has no accent picker - wrong build attached"; exit 1; }
          for f in theme-teal theme-crimson theme-indigo theme-amber theme-violet theme-picker; do
            unzip -l "$APK" | grep -q "assets/$f-1.1.css" \
              || { echo "::error::assets/$f-1.1.css is missing from the APK"; exit 1; }
          done
          COUNT=$(unzip -l "$APK" | grep -cE 'assets/profile-art/(pfp|banner)/art-[0-9]{2}\.webp')
          echo "profile art files in the APK: $COUNT"
          [ "$COUNT" -ge 20 ] || { echo "::error::only $COUNT art files in the APK - the ten-pair pack did not ship"; exit 1; }
          unzip -p "$APK" 'assets/profile-art-arm.js' | grep -aq "'art-10'" \
            || { echo "::error::the art registry in the APK stops before art-10"; exit 1; }
          # 1.2: the native half of the accent theme has to be in the binary.
          # 1.3: the theme files must be reachable from the shell, not merely packed.
          unzip -p "$APK" classes.dex | grep -aq 'KuroWebAssets13' \
            || { echo "::error::the WebView has no overlay asset list - the theme would not load"; exit 1; }
          for f in theme-teal-1.1.css theme-violet-1.1.css theme-graphite-1.1.css \
                   theme-sky-1.1.css theme-indigo-1.1.css theme-emerald-1.1.css \
                   theme-amber-1.1.css theme-sunset-1.1.css theme-crimson-1.1.css \
                   theme-magenta-1.1.css theme-picker-1.1.css theme-accent-1.1.js; do
            unzip -l "$APK" | grep -q "assets/$f" \
              || { echo "::error::assets/$f is missing from the APK"; exit 1; }
            unzip -p "$APK" classes.dex | grep -aq "$f" \
              || { echo "::error::$f is packed but the WebView would drop it again"; exit 1; }
          done
          unzip -p "$APK" classes.dex | grep -aq 'KuroTheme12' \
            || { echo "::error::KuroTheme12 is missing from the APK - the native theme did not ship"; exit 1; }
          unzip -p "$APK" classes.dex | grep -aq 'themeAccent111' \
            || { echo "::error::the APK has no themeAccent111 bridge for the picker"; exit 1; }
          unzip -p "$APK" resources.arsc | grep -aq 'KuroDialogCrimson' \
            || { echo "::error::the per-accent dialog styles are missing from the APK"; exit 1; }
          unzip -p "$APK" classes.dex | grep -aq 'kuro-native-12' \
            || { echo "::error::the native accent preference store is missing"; exit 1; }
          # 1.5: the motion layer, the four feature modules and the shell bridges.
          for f in beta-motion-1.5.css beta-motion-1.5.js theme-rich-1.5.css \
                   beta-extras-1.5.css beta-extras-1.5.js beta-continue-1.5.js \
                   beta-whatsnew-1.5.js beta-downloads-1.5.js intro/animation.mp4; do
            unzip -l "$APK" | grep -q "assets/$f" \
              || { echo "::error::assets/$f is missing from the APK"; exit 1; }
            unzip -p "$APK" classes.dex | grep -aq "/$f" \
              || { echo "::error::$f is packed but the WebView would drop it"; exit 1; }
          done
          test "$(unzip -l "$APK" | grep -cE 'assets/theme-[a-z]+-1\.1\.css')" -ge 20 \
            || { echo "::error::fewer than twenty accent stylesheets in the APK"; exit 1; }
          unzip -p "$APK" assets/index.html | grep -aq 'beta-extras-1.5.js' \
            || { echo "::error::the page never loads the sheet layer - wrong build attached"; exit 1; }
          # the header arrow is the only updater entry point now
          unzip -p "$APK" assets/beta-motion-1.5.js | grep -aq 'km-update-15' \
            || { echo "::error::the header update button is missing"; exit 1; }
          if unzip -p "$APK" assets/beta-motion-1.5.js | grep -aq 'km-update-card'; then
            echo "::error::the Account update card is still being built"; exit 1
          fi
          # feature 2 needs a playhead the shell can answer for
          unzip -p "$APK" classes.dex | grep -aq 'progress15' \
            || { echo "::error::the APK cannot read a playhead - continue watching would show no time"; exit 1; }
          # feature 6 needs the download index
          for m in downloadsSummary15 downloadsClean15 markPlayed15 setActive15; do
            unzip -p "$APK" classes.dex | grep -aq "$m" \
              || { echo "::error::$m is missing from the shell"; exit 1; }
          done
          # feature 5 ships its notes inside the build
          unzip -p "$APK" assets/beta-whatsnew-1.5.js | grep -aq 'var STAMP' \
            || { echo "::error::the what's-new card has no build stamp"; exit 1; }
          unzip -p "$APK" assets/beta-whatsnew-1.5.js | grep -aq 'Continue watching' \
            || { echo "::error::the what's-new card does not describe 1.5"; exit 1; }
          # Discord Rich Presence Download button across all 4 ABIs, DEX, and settings UI
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -p "$APK" "lib/$abi/libkuro_discord_rpc563.so" | grep -aq 'https://lovelycrxshx.github.io/Kuro-tv-Releases/' \
              || { echo "::error::lib/$abi/libkuro_discord_rpc563.so is missing the Download button URL"; exit 1; }
          done
          unzip -p "$APK" classes.dex | grep -aq 'option-download15' \
            || { echo "::error::classes.dex is missing option-download15"; exit 1; }
          unzip -p "$APK" assets/settings560.js | grep -aFq "['download', 'Download button', [['on', 'Show'], ['off', 'Hide']]]" \
            || { echo "::error::assets/settings560.js is missing the Download button toggle"; exit 1; }
          echo "All artifacts sane; APK matches the signed build."

      - name: Build the 1.5 source archive (same overlays and rewrites as the build)
        run: |
          set -euo pipefail
          URL="https://drive.usercontent.google.com/download?id=${SOURCE_ID}&export=download&confirm=t"
          code=$(curl -sSL --retry 3 --retry-delay 4 -o "$RUNNER_TEMP/src.zip" -w '%{http_code}' "$URL")
          bytes=$(stat -c%s "$RUNNER_TEMP/src.zip" 2>/dev/null || echo 0)
          echo "HTTP $code, $bytes bytes"
          [ "$code" = "200" ] && [ "$bytes" -gt 1000000 ] \
            || { echo "::error::source download failed (HTTP $code, $bytes bytes) - is the Drive file still shared with anyone-with-the-link?"; exit 1; }
          mkdir -p src
          unzip -q "$RUNNER_TEMP/src.zip" -d src
          PROJECT=$(dirname "$(find src -maxdepth 3 -name settings.gradle -print -quit)")
          [ -n "$PROJECT" ] || { echo "::error::no settings.gradle in the source zip"; exit 1; }
          ( cd assets-1.1 && find . -type f -print0 ) | while IFS= read -r -d '' f; do
            mkdir -p "$PROJECT/assets/$(dirname "$f")"
            cp -f "assets-1.1/$f" "$PROJECT/assets/$f"
          done
          ( cd assets-beta && find . -type f -print0 ) | while IFS= read -r -d '' f; do
            mkdir -p "$PROJECT/assets/$(dirname "$f")"
            cp -f "assets-beta/$f" "$PROJECT/assets/$f"
          done
          python3 tools/webview_assets_1.3.py "$PROJECT" assets-1.1 assets-beta
          python3 tools/theme_native_1.2.py "$PROJECT"
          python3 tools/discord_link_1.5.py "$PROJECT"
          python3 tools/discord_rpc_download_1.5.py "$PROJECT"
          python3 tools/update_button_1.5.py "$PROJECT"
          python3 tools/offline_beta_1.5.py "$PROJECT"
          sed -i -E "s/versionCode +[0-9]+/versionCode 92/" "$PROJECT/build.gradle"
          sed -i -E "s/versionName +'[^']*'/versionName '1.5'/" "$PROJECT/build.gradle"
          grep -nE "versionName|versionCode" "$PROJECT/build.gradle"
          ROOT=$(dirname "$PROJECT")
          rm -f "dist/$APK_NAME-Source.zip"
          ( cd "$ROOT" && zip -qr "$GITHUB_WORKSPACE/dist/$APK_NAME-Source.zip" . )
          unzip -l "dist/$APK_NAME-Source.zip" | grep -q 'assets/theme-teal-1.1.css' \
            || { echo "::error::the source archive does not contain the accent stylesheets"; exit 1; }
          unzip -l "dist/$APK_NAME-Source.zip" | grep -q 'KuroTheme12.java' \
            || { echo "::error::the source archive does not contain the native theme class"; exit 1; }
          unzip -l "dist/$APK_NAME-Source.zip" | grep -q 'KuroWebAssets13.java' \
            || { echo "::error::the source archive does not contain the served-assets list"; exit 1; }
          for f in beta-motion-1.5.js beta-extras-1.5.js beta-continue-1.5.js \
                   beta-whatsnew-1.5.js beta-downloads-1.5.js theme-rich-1.5.css; do
            unzip -l "dist/$APK_NAME-Source.zip" | grep -q "assets/$f" \
              || { echo "::error::the source archive is missing assets/$f"; exit 1; }
          done
          unzip -p "dist/$APK_NAME-Source.zip" '*KuroOffline561.java' | grep -q 'clean15' \
            || { echo "::error::the source archive has no download housekeeping"; exit 1; }
          unzip -p "dist/$APK_NAME-Source.zip" '*MainActivity.java' | grep -q 'progress15' \
            || { echo "::error::the source archive has no playhead bridge"; exit 1; }
          unzip -p "dist/$APK_NAME-Source.zip" '*KuroOfflineActivity561.java' | grep -q 'markPlayed15' \
            || { echo "::error::the source archive does not mark a download as played"; exit 1; }
          unzip -p "dist/$APK_NAME-Source.zip" '*kuro_discord_rpc563.cpp' | grep -q 'AddButton' \
            || { echo "::error::the source archive has no Discord Rich Presence Download button"; exit 1; }
          unzip -p "dist/$APK_NAME-Source.zip" '*settings560.js' | grep -Fq "['download', 'Download button', [['on', 'Show'], ['off', 'Hide']]]" \
            || { echo "::error::the source archive settings560.js has no Download button toggle"; exit 1; }
          printf '%s  %s\n' "$(sha256sum "dist/$APK_NAME-Source.zip" | cut -d' ' -f1)" "$APK_NAME-Source.zip" \
            > "dist/$APK_NAME-Source.zip.sha256"
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ASSETS=(dist/$APK_NAME.apk dist/$APK_NAME.apk.sha256 dist/$APK_NAME-Source.zip dist/$APK_NAME-Source.zip.sha256)
          for f in "${ASSETS[@]}"; do [ -s "$f" ] || { echo "::error::$f missing"; exit 1; }; done
          SIZE=$(stat -c%s "dist/$APK_NAME.apk")
          sed -e "s/{{APK_SHA256}}/$APK_SHA256/" -e "s/{{APK_BYTES}}/$SIZE/" RELEASE-1.5.md > /tmp/notes.md
          grep -q '{{' /tmp/notes.md && { echo "::error::release notes still contain placeholders"; exit 1; } || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists - uploading assets"
            if ! OUT=$(gh release upload "$TAG" "${ASSETS[@]}" --clobber 2>&1); then
              echo "::error::release upload failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
            if ! OUT=$(gh release edit "$TAG" --notes-file /tmp/notes.md --latest 2>&1); then
              echo "::error::release edit failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
          else
            if ! OUT=$(gh release create "$TAG" "${ASSETS[@]}" \
                 --title "Kuro 1.5" --notes-file /tmp/notes.md --latest 2>&1); then
              echo "::error::release create failed: $(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1
            fi
            echo "$OUT"
          fi
          gh release view "$TAG" --json tagName,name,assets \
            --jq '"published \(.tagName) \(.name) | assets: \(.assets|map("\(.name) \(.size)B")|join(", "))"'

      - name: Keep the apksigner output on the branch (failures only)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          [ -s /tmp/verify.txt ] || java -jar dist/toolchain/apksigner.jar verify --print-certs --verbose "dist/$APK_NAME.apk" > /tmp/verify.txt 2>&1
          cp /tmp/verify.txt dist/apksigner-verify.txt
          git config user.name "Siva"
          git config user.email "sivaabhishek4@gmail.com"
          git add -f dist/apksigner-verify.txt
          git commit -m "publish: apksigner output from the failed run"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push the diagnostics"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release $TAG"
            echo "- tag: \`$TAG\` (target \`${{ github.ref_name }}\`)"
            echo "- APK SHA-256 gate: \`$APK_SHA256\`"
            echo "- notes: \`RELEASE-1.5.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
