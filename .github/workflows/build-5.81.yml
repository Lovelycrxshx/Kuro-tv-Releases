name: build Kuro 5.81 APK

# Builds Kuro 5.81 (versionCode 84) from the source zip stored in Drive, commits the
# *aligned but unsigned* APK back to this branch, and never sees the signing key — the
# owner signs afterwards with the existing release key (CN=Kuro Anime), so no repository
# secrets are involved.
#
# The source lives at Drive file 1_ofr8V7nVGlavv-sNVNziu5oaz6tCFoJ and must be readable
# by "anyone with the link" while the job runs (it is a GPL-3.0 source tree that is
# published as a release asset anyway).
#
# The Discord Social SDK URL is a short-lived signed URL and must not be stored, so it
# travels in the commit message:
#
#     git commit --allow-empty -m "[build81] sdk=<signed sdk zip url>"
#
# Only commits whose message contains "[build81]" run the job.

on:
  push:
    branches: [arena/0514044e-kuro-tv-releases]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuro-5.81
  cancel-in-progress: false

env:
  APK_NAME: Kuro-tv-5.81
  SOURCE_ID: 1_ofr8V7nVGlavv-sNVNziu5oaz6tCFoJ
  EXPECT_VERSION_NAME: "5.81"
  EXPECT_VERSION_CODE: "84"

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build81]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this branch (receives the artifacts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: out
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-/nonexistent}" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME" | head

      - name: Install platform 35, build-tools 35.0.1 and NDK r27c
        run: |
          SDKMANAGER=$(command -v sdkmanager || true)
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" \
            "build-tools;35.0.1" "ndk;27.2.12479018"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -f "$ANDROID_HOME/build-tools/35.0.1/lib/apksigner.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.1/zipalign"
          echo "SDK pieces verified."

      - name: Download the 5.81 source zip from Drive
        run: |
          set -euo pipefail
          URL="https://drive.usercontent.google.com/download?id=${SOURCE_ID}&export=download&confirm=t"
          code=$(curl -sSL --retry 2 --retry-delay 3 -o "$RUNNER_TEMP/src.zip" -w '%{http_code}' "$URL")
          bytes=$(stat -c%s "$RUNNER_TEMP/src.zip" 2>/dev/null || echo 0)
          echo "HTTP $code, $bytes bytes"
          if [ "$code" != "200" ] || [ "$bytes" -lt 1000000 ]; then
            echo "::error::Source download failed (HTTP $code, $bytes bytes). Is the Drive file still shared with anyone-with-the-link?"
            exit 1
          fi
          mkdir -p src
          unzip -q "$RUNNER_TEMP/src.zip" -d src
          PROJECT=$(dirname "$(find src -maxdepth 3 -name settings.gradle -print -quit)")
          [ -n "$PROJECT" ] || { echo "::error::No settings.gradle in the source zip."; exit 1; }
          echo "Project root: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          grep -o 'android:versionCode="[0-9]*" android:versionName="[^"]*"' "$PROJECT/AndroidManifest.xml"

      - name: Verify the 5.81 changes are in this source
        run: |
          set -euo pipefail
          test -f "$PROJECT/src/app/lovelycrxshx/kuro/KuroDialogs581.java" \
            || { echo "::error::KuroDialogs581.java missing from the source zip."; exit 1; }
          grep -q 'name="KuroDialogTheme"' "$PROJECT/res/values/styles.xml" \
            || { echo "::error::KuroDialogTheme missing from styles.xml."; exit 1; }
          themed=$(grep -c 'KuroDialogs581.themed' "$PROJECT/src/app/lovelycrxshx/kuro/MainActivity.java")
          echo "Themed alert dialogs: $themed"
          [ "$themed" -ge 15 ] || { echo "::error::Expected the settings dialogs to use the themed context."; exit 1; }
          grep -q "android:versionName=\"${EXPECT_VERSION_NAME}\"" "$PROJECT/AndroidManifest.xml" \
            || { echo "::error::versionName is not ${EXPECT_VERSION_NAME}."; exit 1; }

      - name: Extract the Discord SDK URL from the commit message
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          URL=$(printf '%s\n' "$MSG" | tr -d '\r' | grep -oE 'sdk=[^ ]+' | head -1 | cut -d= -f2-)
          if [ -z "${URL:-}" ]; then
            echo "::error::No sdk=<url> in the commit message. Push '[build81] sdk=<signed url>'."
            exit 1
          fi
          echo "Discord SDK host: $(printf '%s' "$URL" | cut -d/ -f3)"
          echo "SDK_URL=$URL" >> "$GITHUB_ENV"

      - name: Fetch the Discord Social SDK
        run: |
          code=$(curl -sSL --retry 2 --retry-delay 3 -o "$RUNNER_TEMP/discord-sdk.zip" -w '%{http_code}' "$SDK_URL")
          if [ "$code" != "200" ]; then
            echo "::error::Discord SDK download failed with HTTP $code - signed URLs expire after about an hour."
            exit 1
          fi
          unzip -l "$RUNNER_TEMP/discord-sdk.zip" | head -20

      - name: Locate the Discord AAR
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          unzip -q -o "$RUNNER_TEMP/discord-sdk.zip" -d "$RUNNER_TEMP/sdk"
          AAR=$(find "$RUNNER_TEMP/sdk" -name '*.aar' -print -quit)
          [ -n "$AAR" ] || { echo "::error::No .aar inside the SDK zip."; exit 1; }
          echo "Using $AAR"
          echo "KURO_DISCORD_SDK_AAR=$AAR" >> "$GITHUB_ENV"

      - name: Build the JNI bridge and the unsigned APK
        id: build
        continue-on-error: true
        run: |
          LOG="$RUNNER_TEMP/build.log"
          rc=0
          {
            echo "=== env ==="
            echo "PROJECT=$PROJECT"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "KURO_DISCORD_SDK_AAR=$KURO_DISCORD_SDK_AAR"
            cd "$PROJECT" || exit 1
            pwd
            export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
            chmod +x scripts/build-discord-jni.sh gradlew build.sh 2>/dev/null || true
            echo "=== native bridge ==="
            ./scripts/build-discord-jni.sh
            echo "=== gradle assembleRelease ==="
            ./gradlew --no-daemon --stacktrace --max-workers=2 \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
              assembleRelease
            echo "=== outputs ==="
            ls -lR build/outputs
          } > "$LOG" 2>&1 || rc=$?
          [ "$(grep -cE 'FAILURE: Build failed|Execution failed for task' "$LOG" || true)" -gt 0 ] && rc=1
          cp -f "$LOG" "$GITHUB_WORKSPACE/out/dist/build-5.81.log" 2>/dev/null || cp -f "$LOG" "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true
          echo "::warning::build exit=$rc, $(wc -l < "$LOG") log lines"
          grep -nE 'error:|error;|FAILURE|Execution failed|cannot find symbol|Caused by:|^\s*\^|What went wrong' "$LOG" \
            | tail -40 | while IFS= read -r line; do echo "::error::$(printf '%s' "$line" | cut -c1-380)"; done
          tail -20 "$LOG" | while IFS= read -r line; do echo "::warning::tail: $(printf '%s' "$line" | cut -c1-380)"; done
          exit "$rc"

      - name: Align the APK (signing happens later, off this runner)
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$PROJECT"
          IN=build/outputs/apk/release/Kuro-tv-release-unsigned.apk
          [ -f "$IN" ] || { echo "::error::unsigned APK missing"; ls -R build/outputs | head -30; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -f -P 16 4 "$IN" "$RUNNER_TEMP/$APK_NAME-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 4 "$RUNNER_TEMP/$APK_NAME-aligned.apk"
          ls -lh "$RUNNER_TEMP/$APK_NAME-aligned.apk"
          sha256sum "$RUNNER_TEMP/$APK_NAME-aligned.apk"

      - name: Report the build log
        if: always()
        run: |
          set -uo pipefail
          mkdir -p out/dist out/dist/toolchain
          for candidate in "$GITHUB_WORKSPACE/build.log" out/dist/build-5.81.log "$RUNNER_TEMP/build.log"; do
            if [ -s "$candidate" ]; then cp -f "$candidate" out/dist/build-5.81.log; fi
          done
          if [ -s "out/dist/build-5.81.log" ]; then
            cp out/dist/build-5.81.log "$GITHUB_WORKSPACE/build.log" 
            echo "::warning::build log has $(wc -l < "$GITHUB_WORKSPACE/build.log") lines"
            grep -nE 'error:|error;|Error|FAILURE|Could not|not found|Exception|cannot find symbol' "$GITHUB_WORKSPACE/build.log" \
              | tail -30 | while IFS= read -r line; do echo "::warning::${line}"; done
            tail -15 "$GITHUB_WORKSPACE/build.log" | while IFS= read -r line; do echo "::warning::tail: ${line}"; done
          else
            echo "::warning::build log missing"
          fi
          cp "$ANDROID_HOME/build-tools/35.0.1/lib/apksigner.jar" out/dist/toolchain/apksigner.jar 2>/dev/null || true
          cp "$ANDROID_HOME/build-tools/35.0.1/zipalign" out/dist/toolchain/zipalign 2>/dev/null || true
          chmod +x out/dist/toolchain/zipalign 2>/dev/null || true
          cd out
          git config user.name  "kuro-build"
          git config user.email "kuro-build@users.noreply.github.com"
          git add -f dist/build-5.81.log dist/toolchain 2>/dev/null || true
          git commit -m "build: 5.81 runner log + signer toolchain" || true
          if ! OUT_ERR=$(git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1); then
            echo "::error::push failed: $(printf '%s' "$OUT_ERR" | tr '\n' ' ' | cut -c1-400)"
          fi

      - name: Commit the aligned APK
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p out/dist
          cp "$RUNNER_TEMP/$APK_NAME-aligned.apk" "out/dist/$APK_NAME-aligned.apk"
          ( cd out/dist && sha256sum "$APK_NAME-aligned.apk" | tee "$APK_NAME-aligned.apk.sha256" )
          {
            echo "### Built \`$APK_NAME-aligned.apk\` (unsigned, zipaligned -P 16)"
            echo '```'
            cat "out/dist/$APK_NAME-aligned.apk.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cd out
          git config user.name  "kuro-build"
          git config user.email "kuro-build@users.noreply.github.com"
          git add "dist/$APK_NAME-aligned.apk" "dist/$APK_NAME-aligned.apk.sha256"
          git commit -m "build: $APK_NAME aligned APK (unsigned)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail the run if the build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::compile failed - see dist/build-5.81.log on ${GITHUB_REF_NAME}"
          exit 1
