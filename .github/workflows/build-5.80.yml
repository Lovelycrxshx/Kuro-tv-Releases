name: build Kuro 5.80 APK

# Builds Kuro 5.80 (versionCode 83) from the source tree on branch
# arena/c8020225-kuro-tv-releases and commits the *aligned but unsigned* APK back
# to this branch. It deliberately never sees the signing key: the owner signs the
# aligned APK afterwards with the existing release key, so no repository secrets
# are needed at all.
#
# The Discord Social SDK URL is a short-lived signed URL and must not be stored,
# so it travels in the commit message:
#
#     git commit --allow-empty -m "[build] sdk=<signed sdk zip url>"
#
# Only commits whose message contains "[build]" run the job.

on:
  push:
    branches: [arena/454cd01a-kuro-tv-releases]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kuro-5.80
  cancel-in-progress: false

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APK_NAME: Kuro-tv-5.80
    steps:
      - name: Check out the source tree
        uses: actions/checkout@v4
        with:
          ref: arena/c8020225-kuro-tv-releases
          path: src

      - name: Check out this branch (receives the artifacts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: out
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-/nonexistent}" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME" | head

      - name: Install platform 35, build-tools 35.0.1 and NDK r27c
        run: |
          SDKMANAGER=$(command -v sdkmanager || true)
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" \
            "build-tools;35.0.1" "ndk;27.2.12479018"
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.1/lib/apksigner.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.1/zipalign"
          test -d "$ANDROID_HOME/platforms/android-35"
          echo "SDK pieces verified."

      - name: Extract the Discord SDK URL from the commit message
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          URL=$(printf '%s\n' "$MSG" | tr -d '\r' | grep -oE 'sdk=[^ ]+' | head -1 | cut -d= -f2-)
          if [ -z "${URL:-}" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::No sdk= URL in a manual run; push a commit message containing '[build] sdk=<url>'."
            else
              echo "::error::No sdk=<url> found in the commit message."
            fi
            exit 1
          fi
          # only the host is printed - the signed query string stays out of the log
          echo "Discord SDK host: $(printf '%s' "$URL" | cut -d/ -f3)"
          echo "SDK_URL=$URL" >> "$GITHUB_ENV"

      - name: Fetch the Discord Social SDK
        run: |
          code=$(curl -sSL --retry 2 --retry-delay 3 -o "$RUNNER_TEMP/discord-sdk.zip" -w '%{http_code}' "$SDK_URL")
          if [ "$code" != "200" ]; then
            echo "::error::Discord SDK download failed with HTTP $code - signed URLs expire after about an hour."
            exit 1
          fi
          file "$RUNNER_TEMP/discord-sdk.zip"
          unzip -l "$RUNNER_TEMP/discord-sdk.zip" | head -30

      - name: Locate the Discord AAR
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          unzip -q -o "$RUNNER_TEMP/discord-sdk.zip" -d "$RUNNER_TEMP/sdk"
          AAR=$(find "$RUNNER_TEMP/sdk" -name '*.aar' -print -quit)
          [ -n "$AAR" ] || { echo "::error::No .aar inside the SDK zip - see the listing above."; exit 1; }
          echo "Using $AAR"
          unzip -l "$AAR" | grep -E 'prefab/modules/discord_partner_sdk/include/|jni/.*libdiscord_partner_sdk\.so' | head -10 \
            || echo "::warning::Expected prefab headers / jni libs not listed; the JNI step may fail."
          echo "KURO_DISCORD_SDK_AAR=$AAR" >> "$GITHUB_ENV"

      - name: Build the JNI bridge and the unsigned APK
        working-directory: src/app
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -euo pipefail
          chmod +x build.sh scripts/build-discord-jni.sh gradlew
          ./scripts/build-discord-jni.sh
          ./gradlew --no-daemon assembleRelease
          ls -l build/outputs/apk/release/

      - name: Align the APK (signing happens later, off this runner)
        working-directory: src/app
        run: |
          set -euo pipefail
          IN=build/outputs/apk/release/Kuro-tv-release-unsigned.apk
          [ -f "$IN" ] || { echo "::error::unsigned APK missing"; ls -R build/outputs | head -30; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -f -P 16 4 "$IN" "$RUNNER_TEMP/$APK_NAME-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 4 "$RUNNER_TEMP/$APK_NAME-aligned.apk"
          ls -lh "$RUNNER_TEMP/$APK_NAME-aligned.apk"
          sha256sum "$RUNNER_TEMP/$APK_NAME-aligned.apk"

      - name: Commit the aligned APK and the signer toolchain
        run: |
          set -euo pipefail
          mkdir -p out/dist out/dist/toolchain
          cp "$RUNNER_TEMP/$APK_NAME-aligned.apk" "out/dist/$APK_NAME-aligned.apk"
          cp "$ANDROID_HOME/build-tools/35.0.1/lib/apksigner.jar" out/dist/toolchain/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.1/zipalign" out/dist/toolchain/zipalign
          chmod +x out/dist/toolchain/zipalign
          ( cd out/dist && sha256sum "$APK_NAME-aligned.apk" | tee "$APK_NAME-aligned.apk.sha256" )
          {
            echo "### Built \`$APK_NAME-aligned.apk\` (unsigned, zipaligned -P 16)"
            echo '```'
            cat "out/dist/$APK_NAME-aligned.apk.sha256"
            echo '```'
            echo "Sign with the owner's PKCS#12 key; nothing secret touched this runner."
          } >> "$GITHUB_STEP_SUMMARY"
          cd out
          git config user.name  "kuro-build"
          git config user.email "kuro-build@users.noreply.github.com"
          git add dist
          git commit -m "build: $APK_NAME aligned APK + signer toolchain (unsigned)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Committed dist/ to ${GITHUB_REF_NAME}"
