name: inspect native sources

# One-off helper for the 1.2 native-theme work: pulls the source zip from Drive,
# copies every text source file (java/kt/xml/gradle/properties, minus assets/) into
# design/native-src/ on the dispatched branch, writes a grep report next to it, and
# pushes the result.  The build job still owns the real APK; this only makes the
# Java side readable from a sandbox that cannot download Drive files.

on:
  push:
    branches: [main, 'arena/**']

permissions:
  contents: write

env:
  SOURCE_ID: 1tvE3FJdC_PIxGBN_fLlmqJMmRzjy65sO

jobs:
  dump:
    if: contains(github.event.head_commit.message, '[inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Download the source zip
        run: |
          set -euo pipefail
          URL="https://drive.usercontent.google.com/download?id=${SOURCE_ID}&export=download&confirm=t"
          code=$(curl -sSL --retry 3 --retry-delay 4 -o "$RUNNER_TEMP/src.zip" -w '%{http_code}' "$URL")
          bytes=$(stat -c%s "$RUNNER_TEMP/src.zip" 2>/dev/null || echo 0)
          echo "HTTP $code, $bytes bytes"
          if [ "$code" != "200" ] || [ "$bytes" -lt 1000000 ]; then
            echo "::error::source download failed (HTTP $code, $bytes bytes) - is the Drive file shared with anyone-with-the-link?"
            exit 1
          fi
          mkdir -p src
          unzip -q "$RUNNER_TEMP/src.zip" -d src

      - name: Extract the text sources
        run: |
          set -euo pipefail
          PROJECT=$(dirname "$(find src -maxdepth 3 -name settings.gradle -print -quit)")
          [ -n "$PROJECT" ] || { echo "::error::no settings.gradle in the source zip"; exit 1; }
          echo "project root: $PROJECT"
          echo "$PROJECT" > "$RUNNER_TEMP/project.txt"
          DEST=design/native-src
          rm -rf "$DEST"; mkdir -p "$DEST"
          find "$PROJECT" -type f -size -1M \
              \( -name '*.java' -o -name '*.kt' -o -name '*.gradle' \
                 -o -name '*.properties' -o -name '*.pro' -o -name '*.xml' \) \
              -not -path '*/assets/*' -not -path '*/build/*' -print0 |
            while IFS= read -r -d '' f; do
              rel=${f#"$PROJECT"/}
              mkdir -p "$DEST/$(dirname "$rel")"
              cp "$f" "$DEST/$rel"
            done
          echo "files: $(find "$DEST" -type f | wc -l), size: $(du -sh "$DEST" | cut -f1)"

      - name: Write the grep report
        run: |
          set -euo pipefail
          PROJECT=$(cat "$RUNNER_TEMP/project.txt")
          DEST=design/native-src
          R="$DEST/REPORT.md"
          {
            echo "# Native source inventory (generated by inspect-source.yml)"
            echo
            echo "Project root inside the source zip: \`$PROJECT\`"
            echo
            echo "## Java/Kotlin files"
            echo '```'
            ( cd "$DEST" && find . -type f \( -name '*.java' -o -name '*.kt' \) | sort )
            echo '```'
            echo "## Hex colour literals in Java (count by value)"
            echo '```'
            grep -rhoE '0x[0-9a-fA-F]{8}|#[0-9a-fA-F]{6}\b' "$PROJECT" \
              --include='*.java' --include='*.kt' 2>/dev/null | tr 'A-F' 'a-f' | sort | uniq -c | sort -rn | head -40
            echo '```'
            echo "## Colour resources (res/values*/*.xml)"
            echo '```'
            grep -rnE '<color name=' "$PROJECT" --include='*.xml' 2>/dev/null | head -80 || true
            echo '```'
            echo "## Colours from the shipped CSS, for comparison"
            echo '```'
            grep -rhoE '#[0-9a-fA-F]{6}' "$PROJECT/assets/theme-violet-1.1.css" 2>/dev/null | tr 'A-F' 'a-f' | sort | uniq -c | sort -rn | head -25 || true
            echo '```'
            echo "## Status bar / navigation bar / window colour calls"
            echo '```'
            grep -rnE 'setStatusBarColor|setNavigationBarColor|SYSTEM_UI_FLAG|WindowInsetsController|setBackgroundColor|getWindow\(\)' \
              "$PROJECT" --include='*.java' --include='*.kt' 2>/dev/null | head -60 || true
            echo '```'
            echo "## Javascript bridges and preference keys"
            echo '```'
            grep -rnE '@JavascriptInterface|addJavascriptInterface|SharedPreferences|getSharedPreferences|themeAccent' \
              "$PROJECT" --include='*.java' --include='*.kt' 2>/dev/null | head -80 || true
            echo '```'
            echo "## Update / download dialog touch points"
            echo '```'
            grep -rniE 'update|download' "$PROJECT/res/layout" 2>/dev/null | head -40 || true
            echo '```'
            echo "## res/values and res/layout listing"
            echo '```'
            ( cd "$PROJECT" && find . -path '*res/values*' -o -path '*res/layout*' | sort | head -120 )
            echo '```'
          } > "$R"
          wc -l "$R"

      - name: Commit the sources back to this branch
        run: |
          set -euo pipefail
          git config user.name  "Kuro release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add design/native-src
          if git diff --cached --quiet; then
            echo "nothing to commit - sources unchanged"
          else
            git commit -m "Design: extract the native sources for the 1.2 theme work"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
